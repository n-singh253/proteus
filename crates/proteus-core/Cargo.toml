[package]
name = "proteus-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
lofty = "0.25"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
rayon = "1.12"
rusty-chromaprint = "0.3"
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
walkdir = "2.5"
